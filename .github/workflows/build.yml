name: Build

on:
  push:
    branches: [anno2070]
  pull_request:
    branches: [anno2070]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.compiler }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: |
          $compiler = if ('${{ matrix.compiler }}' -eq 'msvc') { 'cl' } else { 'clang-cl' }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=$compiler" "-DCMAKE_CXX_COMPILER=$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --parallel
      - name: Test proxy
        run: ctest --test-dir build --output-on-failure
      - name: Check PE imports and exports
        shell: pwsh
        run: python scripts/check-pe.py build/version.dll --readobj 'C:/Program Files/LLVM/bin/llvm-readobj.exe'
      - name: Stage package
        run: cmake --install build --prefix dist --component Runtime
      - uses: actions/upload-artifact@v7
        with:
          name: anno2070-${{ matrix.compiler }}-windows-x64
          path: dist/
          if-no-files-found: error

  nix:
    name: NixOS-compatible Clang cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check development tooling
        run: nix flake check
      - name: Cross-build and inspect
        run: |
          nix develop -c xwin --accept-license --manifest cmake/xwin-manifest.json splat --output "$PWD/.xwin"
          nix develop -c cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/clang-msvc.cmake
          nix develop -c cmake --build build --parallel 2
          nix develop -c python scripts/check-pe.py build/version.dll
      - name: Package Clang release
        run: nix develop -c cpack --config build/CPackConfig.cmake -B build
      - uses: actions/upload-artifact@v7
        with:
          name: release-clang
          path: build/anno2070-mod-loader-*-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: clang-proxy-smoke
          path: build/proxy-smoke.exe
          if-no-files-found: error

  release-smoke:
    name: Test release DLL on Windows
    needs: nix
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-clang
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: clang-proxy-smoke
          path: smoke
      - name: Extract release package
        shell: pwsh
        run: |
          $zip = Get-Item release/anno2070-mod-loader-*-windows-x64.zip
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath package
      - name: Check packaged PE imports and exports
        shell: pwsh
        run: python scripts/check-pe.py package/version.dll --readobj 'C:/Program Files/LLVM/bin/llvm-readobj.exe'
      - name: Test packaged proxy
        shell: pwsh
        run: '& ./smoke/proxy-smoke.exe (Resolve-Path package/version.dll).Path'
