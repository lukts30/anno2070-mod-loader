name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag to CMake version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py "$RELEASE_TAG"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-clang
          path: release
      - name: Checksum release package
        working-directory: release
        run: sha256sum anno2070-mod-loader-*-windows-x64.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Anno 2070 Mod Loader ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installation
            For **Anno 2070 version 3.00.8051 (64-bit)**.

            Download the attached `anno2070-mod-loader-…-windows-x64.zip` and extract it beside the game executable.
            Place mod packages in a `mods` folder in the same directory.

            **Wine/Proton:** set the DLL override to `version=n,b`.

            Restart the game after changing mods. Loading diagnostics are written to `anno2070-modloader.log` beside the game executable.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/anno2070-mod-loader-*-windows-x64.zip
            release/SHA256SUMS
